<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cave Coffee Shop</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf8f5; color: #1a1a1a; }
.app { max-width: 900px; margin: 0 auto; }
nav { display: flex; gap: 0; border-bottom: 0.5px solid rgba(0,0,0,0.12); background: #fff; position: sticky; top: 0; z-index: 10; }
.nav-btn { flex: 1; padding: 12px 8px; font-size: 13px; font-weight: 500; border: none; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; color: #666; transition: all 0.2s; }
.nav-btn.active { color: #1a1a1a; border-bottom-color: #7B5C3E; }
.nav-btn:hover:not(.active) { background: #f5f5f5; }
.nav-btn.admin-nav { color: #999; font-size: 12px; border-left: 0.5px solid rgba(0,0,0,0.08); }
.nav-btn.admin-nav.active { border-bottom-color: #444; color: #1a1a1a; }
.page { display: none; padding: 0; }
.page.active { display: block; }

.hero { position: relative; text-align: center; }
.hero img { width: 100%; max-height: 380px; object-fit: cover; display: block; }
.hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; }
.hero-title { color: #fff; font-size: 26px; font-weight: 500; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.hero-btns { display: flex; gap: 24px; }
.hero-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.5); border-radius: 14px; padding: 16px 24px; color: #fff; transition: all 0.2s; backdrop-filter: blur(4px); min-width: 120px; }
.hero-btn:hover { background: rgba(255,255,255,0.28); border-color: #fff; transform: translateY(-2px); }
.hero-btn-icon { width: 44px; height: 44px; }
.hero-btn-label { font-size: 13px; font-weight: 500; }

.section-header { padding: 24px 20px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
.section-header h2 { font-size: 18px; font-weight: 500; }
.section-header p { font-size: 13px; color: #666; margin-top: 4px; }

.bean-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 20px; }
.bean-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; }
.bean-card-color { height: 72px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bean-card-body { padding: 14px 16px; }
.bean-card-name { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.bean-card-origin { font-size: 12px; color: #666; margin-bottom: 8px; }
.bean-card-desc { font-size: 12px; color: #666; line-height: 1.6; }
.bean-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.bean-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #F5EFE8; color: #7B5C3E; }

.drink-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 20px; }
.drink-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.drink-top { display: flex; justify-content: space-between; align-items: flex-start; }
.drink-name { font-size: 15px; font-weight: 500; }
.drink-price { font-size: 15px; font-weight: 500; color: #7B5C3E; }
.drink-desc { font-size: 12px; color: #666; line-height: 1.6; flex: 1; }
.drink-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.drink-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
.badge-hot { background: #FAECE7; color: #993C1D; }
.badge-cold { background: #E6F1FB; color: #185FA5; }
.badge-both { background: #EAF3DE; color: #3B6D11; }
.badge-bean { background: #f0f0f0; color: #555; }
.add-btn { width: 100%; padding: 8px; font-size: 13px; font-weight: 500; border: 0.5px solid #7B5C3E; border-radius: 8px; background: transparent; color: #7B5C3E; cursor: pointer; transition: all 0.2s; }
.add-btn:hover { background: #7B5C3E; color: #fff; }

.cart-container { padding: 20px; }
.cart-empty { text-align: center; padding: 60px 20px; color: #888; font-size: 14px; }
.cart-empty-icon { font-size: 40px; margin-bottom: 12px; }
.cart-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
.cart-item-name { flex: 1; font-size: 14px; font-weight: 500; }
.cart-item-sub { font-size: 12px; color: #888; margin-top: 2px; }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 26px; height: 26px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 50%; background: #f5f5f5; cursor: pointer; font-size: 16px; color: #1a1a1a; display: flex; align-items: center; justify-content: center; line-height: 1; }
.qty-btn:hover { background: #e5e5e5; }
.qty-num { font-size: 14px; min-width: 20px; text-align: center; }
.cart-item-price { font-size: 14px; font-weight: 500; color: #7B5C3E; min-width: 56px; text-align: right; }
.remove-btn { background: none; border: none; cursor: pointer; color: #aaa; font-size: 16px; padding: 4px; }
.cart-summary { margin-top: 20px; background: #f5f5f0; border-radius: 12px; padding: 16px 20px; }
.cart-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 8px; }
.cart-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 500; padding-top: 10px; border-top: 0.5px solid rgba(0,0,0,0.1); }
.checkout-btn { width: 100%; margin-top: 16px; padding: 12px; background: #7B5C3E; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.checkout-btn:hover { background: #5E4530; }
.customer-info { margin-top: 16px; background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 16px 18px; }
.customer-info-title { font-size: 14px; font-weight: 500; margin-bottom: 14px; }
.info-field { margin-bottom: 12px; }
.info-field:last-of-type { margin-bottom: 0; }
.info-label { font-size: 12px; color: #666; margin-bottom: 5px; display: block; }
.info-label .req { color: #c0392b; margin-left: 2px; }
.info-input { width: 100%; padding: 9px 12px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 14px; outline: none; background: #faf8f5; transition: border-color 0.2s; font-family: inherit; }
.info-input:focus { border-color: #7B5C3E; background: #fff; }
.info-input.error { border-color: #c0392b; }

/* Admin login */
.admin-login-wrap { display: flex; align-items: center; justify-content: center; min-height: 360px; padding: 40px 20px; }
.admin-login-box { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 360px; text-align: center; }
.admin-login-icon { width: 56px; height: 56px; background: #F5EFE8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.admin-login-title { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.admin-login-sub { font-size: 13px; color: #888; margin-bottom: 24px; }
.admin-login-input { width: 100%; padding: 10px 14px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 18px; outline: none; margin-bottom: 12px; letter-spacing: 6px; text-align: center; }
.admin-login-input:focus { border-color: #7B5C3E; box-shadow: 0 0 0 2px rgba(123,92,62,0.12); }
.admin-login-btn { width: 100%; padding: 11px; background: #7B5C3E; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.admin-login-btn:hover { background: #5E4530; }
.admin-login-err { font-size: 12px; color: #c0392b; margin-top: 10px; display: none; }

/* Admin dashboard */
.admin-dash { padding: 20px; }
.admin-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.admin-topbar h3 { font-size: 16px; font-weight: 500; }
.admin-logout-btn { font-size: 12px; padding: 6px 14px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 20px; background: transparent; cursor: pointer; color: #666; }
.admin-logout-btn:hover { background: #f0f0f0; }
.admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 10px; padding: 14px 16px; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 6px; }
.stat-val { font-size: 24px; font-weight: 500; }
.stat-val.brown { color: #7B5C3E; }
.stat-val.pending { color: #d97706; }
.stat-val.done { color: #3B6D11; }
.admin-filter { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-btn { padding: 6px 14px; font-size: 12px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 20px; background: transparent; cursor: pointer; color: #666; transition: all 0.15s; }
.filter-btn.active { background: #7B5C3E; color: #fff; border-color: #7B5C3E; }
.order-empty { text-align: center; padding: 48px 20px; color: #aaa; font-size: 14px; }
.order-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.order-card.is-done { opacity: 0.7; }
.order-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.order-id { font-size: 14px; font-weight: 500; }
.order-time { font-size: 12px; color: #aaa; margin-top: 2px; }
.order-items { margin-bottom: 12px; border-top: 0.5px solid rgba(0,0,0,0.07); padding-top: 10px; }
.order-item-row { display: flex; justify-content: space-between; font-size: 13px; color: #444; padding: 3px 0; }
.order-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 0.5px solid rgba(0,0,0,0.08); }
.order-total-label { font-size: 12px; color: #888; }
.order-total-val { font-size: 15px; font-weight: 500; color: #7B5C3E; margin-top: 2px; }
.status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.status-pending { background: #FEF3C7; color: #92400E; }
.status-done { background: #EAF3DE; color: #3B6D11; }
.confirm-btn { padding: 8px 18px; font-size: 12px; font-weight: 500; background: #7B5C3E; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
.confirm-btn:hover { background: #5E4530; }
.done-check { font-size: 12px; color: #3B6D11; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3C3434; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; white-space: nowrap; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <nav>
    <button class="nav-btn active" onclick="showPage('home')">首頁</button>
    <button class="nav-btn" onclick="showPage('beans')">咖啡品種</button>
    <button class="nav-btn" onclick="showPage('drinks')">咖啡飲品介紹</button>
    <button class="nav-btn" onclick="showPage('cart')">購物車 <span id="cart-count"></span></button>
    <button class="nav-btn admin-nav" onclick="showPage('admin')">後台管理</button>
  </nav>

  <!-- 首頁 -->
  <div id="home" class="page active">
    <div class="hero">
      <img src="https://i.ibb.co/xKWjwKLt/cavecoffeeshop.jpg" alt="Cave Coffee Shop" />
      <div class="hero-overlay">
        <div class="hero-title">Cave Coffee Shop</div>
        <div class="hero-btns">
          <div class="hero-btn" onclick="showPage('beans')">
            <svg class="hero-btn-icon" viewBox="0 0 44 44" fill="none">
              <ellipse cx="22" cy="22" rx="14" ry="10" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
              <path d="M10 22 Q16 16 22 22 Q28 28 34 22" stroke="white" stroke-width="1.5" fill="none"/>
              <circle cx="22" cy="22" r="3" fill="white"/>
            </svg>
            <span class="hero-btn-label">咖啡品種</span>
          </div>
          <div class="hero-btn" onclick="showPage('drinks')">
            <svg class="hero-btn-icon" viewBox="0 0 44 44" fill="none">
              <path d="M13 16 L14 34 Q14 36 16 36 L28 36 Q30 36 30 34 L31 16 Z" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
              <path d="M30 20 L34 20 Q37 20 37 24 Q37 28 34 28 L30 28" stroke="white" stroke-width="1.5" fill="none"/>
              <path d="M17 10 Q19 7 21 10 Q23 13 25 10" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
            <span class="hero-btn-label">咖啡飲品介紹</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 咖啡品種 -->
  <div id="beans" class="page">
    <div class="section-header">
      <h2>咖啡品種</h2>
      <p>探索世界各地精選咖啡豆，每一種都有其獨特的風味與故事</p>
    </div>
    <div class="bean-grid" id="bean-grid"></div>
  </div>

  <!-- 咖啡飲品介紹 -->
  <div id="drinks" class="page">
    <div class="section-header">
      <h2>咖啡飲品介紹</h2>
      <p>精心調製的咖啡飲品，滿足每一種味蕾的需求</p>
    </div>
    <div class="drink-grid" id="drink-grid"></div>
  </div>

  <!-- 購物車 -->
  <div id="cart" class="page">
    <div class="section-header">
      <h2>購物車</h2>
      <p>確認您的訂單內容</p>
    </div>
    <div class="cart-container" id="cart-container"></div>
  </div>

  <!-- 後台管理 -->
  <div id="admin" class="page">
    <div class="admin-login-wrap" id="admin-login">
      <div class="admin-login-box">
        <div class="admin-login-icon">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <rect x="4" y="12" width="18" height="12" rx="3" fill="#7B5C3E"/>
            <path d="M8 12V8a5 5 0 0 1 10 0v4" stroke="#7B5C3E" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="13" cy="18" r="2" fill="#fff"/>
          </svg>
        </div>
        <div class="admin-login-title">後台管理登入</div>
        <div class="admin-login-sub">請輸入管理員密碼</div>
        <input class="admin-login-input" type="password" id="admin-pwd" placeholder="● ● ● ● ●" maxlength="10"
          onkeydown="if(event.key==='Enter')adminLogin()" />
        <button class="admin-login-btn" onclick="adminLogin()">登入</button>
        <div class="admin-login-err" id="admin-err">密碼錯誤，請重新輸入</div>
      </div>
    </div>
    <div class="admin-dash" id="admin-dash" style="display:none">
      <div class="admin-topbar">
        <h3>訂單管理</h3>
        <button class="admin-logout-btn" onclick="adminLogout()">登出</button>
      </div>
      <div class="admin-stats" id="admin-stats"></div>
      <div class="admin-filter">
        <button class="filter-btn active" id="filter-all" onclick="setFilter('all',this)">全部</button>
        <button class="filter-btn" id="filter-pending" onclick="setFilter('pending',this)">待完成</button>
        <button class="filter-btn" id="filter-done" onclick="setFilter('done',this)">已完成</button>
      </div>
      <div id="admin-orders"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   ★★★  請將下方網址替換為您自己的 Apps Script 部署網址  ★★★
   取得方式：Google Sheets → 擴充功能 → Apps Script
            → 部署 → 新增部署作業 → 網頁應用程式 → 複製網址
   ═══════════════════════════════════════════════════════ */
const GAS_URL = '請填入您的_Apps_Script_網址';

/* ─────────────────────────────────────── */

const beans = [
  { name: "阿拉比卡", origin: "衣索比亞・葉門", color: "#6B4226", bg: "#F5EFE8", img: "https://i.ibb.co/hxQHLN7r/image.jpg", desc: "世界上最受歡迎的咖啡品種，佔全球產量約60%。風味細膩，帶有水果和花香調性，酸度適中。", tags: ["花香", "果酸", "低苦"] },
  { name: "羅布斯塔", origin: "剛果・越南", color: "#3D2B1F", bg: "#EDE0D4", img: "https://i.ibb.co/Wpd7dyC4/Robusta.jpg", desc: "咖啡因含量是阿拉比卡的兩倍，口感濃郁厚重，帶有堅果與巧克力風味，常用於義式濃縮配方。", tags: ["濃郁", "堅果", "高咖啡因"] },
  { name: "利比里卡", origin: "菲律賓・馬來西亞", color: "#5C4033", bg: "#F0E6DA", desc: "產量稀少，約佔全球2%。風味獨特，帶有煙燻、木質與花香，豆型較大，是咖啡愛好者的珍稀選擇。", tags: ["煙燻", "木質", "稀有"] },
  { name: "藝妓", origin: "巴拿馬・衣索比亞", color: "#8B6355", bg: "#FAF0E8", desc: "精品咖啡界的明星，以茉莉花、柑橘和熱帶水果香氣聞名，口感如茶般輕盈透明，拍賣價屢創新高。", tags: ["茉莉花", "柑橘", "精品"] },
  { name: "藍山咖啡", origin: "牙買加", color: "#4A6FA5", bg: "#E6EFF8", desc: "產自牙買加藍山山脈，擁有均衡完美的酸甜苦比例，無苦澀感，溫和柔順，被譽為咖啡之王。", tags: ["均衡", "柔順", "無苦澀"] },
  { name: "曼特寧", origin: "印尼蘇門答臘", color: "#2C4A3E", bg: "#E6F2EE", desc: "印尼最著名的咖啡品種，以濃郁的黑巧克力、草本和土壤氣息為特色，低酸度高醇厚度，餘韻悠長。", tags: ["巧克力", "草本", "低酸"] }
];

const drinks = [
  { name: "義式濃縮", price: 60, img: "https://i.ibb.co/Q3sB8gxZ/image.jpg", desc: "以高壓萃取的濃縮咖啡精華，濃郁強勁，表面覆蓋一層金棕色克萊瑪，是所有咖啡飲品的基礎。", temp: "hot", bean: "阿拉比卡 / 羅布斯塔" },
  { name: "美式咖啡", price: 70, img: "https://i.ibb.co/r2GCdXSW/image.jpg", desc: "義式濃縮加入熱水稀釋，口感介於濃縮與手沖之間，風味乾淨清爽，最能展現咖啡豆本身的特色。", temp: "both", bean: "阿拉比卡" },
  { name: "拿鐵", price: 110, img: "https://i.ibb.co/0pY85CDx/image.jpg", desc: "義式濃縮搭配大量蒸製奶泡，奶香濃郁，咖啡與牛奶完美融合，口感絲滑柔順，是最受歡迎的咖啡飲品。", temp: "both", bean: "阿拉比卡" },
  { name: "卡布奇諾", price: 110, img: "https://i.ibb.co/Df63v3nV/image.jpg", desc: "由等比例的義式濃縮、蒸奶與奶泡構成，層次分明，入口先嚐奶泡的輕盈，再感受咖啡的香醇。", temp: "hot", bean: "阿拉比卡 / 羅布斯塔" },
  { name: "馥芮白", price: 120, img: "https://i.ibb.co/d4TrPb5b/image.jpg", desc: "起源於澳洲，以雙份濃縮搭配少量絲滑蒸奶，咖啡風味更突出，牛奶比例低但奶香更濃縮細膩。", temp: "hot", bean: "藝妓" },
  { name: "冷萃咖啡", price: 130, img: "https://i.ibb.co/gL7JGfxF/image.jpg", desc: "以冷水浸泡咖啡粉12-24小時慢速萃取，低酸度、低苦味，口感圓潤順滑，天然甜感顯著。", temp: "cold", bean: "藍山咖啡" },
  { name: "冰滴咖啡", price: 140, img: "https://i.ibb.co/TMzmkgDP/image.jpg", desc: "以冷水一滴一滴緩慢滴落萃取，過程耗時8小時以上，風味層次豐富，帶有獨特的焦糖與果香。", temp: "cold", bean: "曼特寧" },
  { name: "摩卡", price: 120, img: "https://i.ibb.co/DNQ59CK/image.jpg", desc: "義式濃縮結合巧克力醬與蒸奶，咖啡的苦、巧克力的甜、牛奶的醇完美交織，頂部點綴鮮奶油。", temp: "both", bean: "羅布斯塔" }
];

let cart = [];
let orders = [];
let adminLoggedIn = false;
let currentFilter = 'all';
let adminPollTimer = null;

/* ── Navigation ── */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const pages = ['home','beans','drinks','cart','admin'];
  document.querySelectorAll('.nav-btn')[pages.indexOf(id)].classList.add('active');
  if (id === 'cart') renderCart();
  if (id === 'admin' && adminLoggedIn) loadOrders();
}

/* ── Beans ── */
function renderBeans() {
  document.getElementById('bean-grid').innerHTML = beans.map(b => `
    <div class="bean-card">
      <div class="bean-card-color" style="background:${b.bg}">
        ${b.img
          ? `<img src="${b.img}" alt="${b.name}" style="width:100%;height:72px;object-fit:cover;display:block;">`
          : `<svg width="52" height="36" viewBox="0 0 52 36"><ellipse cx="26" cy="18" rx="20" ry="13" fill="${b.color}" opacity="0.85"/><path d="M10 18 Q18 10 26 18 Q34 26 42 18" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/></svg>`}
      </div>
      <div class="bean-card-body">
        <div class="bean-card-name">${b.name}</div>
        <div class="bean-card-origin">產地：${b.origin}</div>
        <div class="bean-card-desc">${b.desc}</div>
        <div class="bean-tags">${b.tags.map(t => `<span class="bean-tag">${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

/* ── Drinks ── */
function renderDrinks() {
  const tempLabel = { hot:'熱飲', cold:'冷飲', both:'冷熱皆可' };
  const tempClass = { hot:'badge-hot', cold:'badge-cold', both:'badge-both' };
  document.getElementById('drink-grid').innerHTML = drinks.map((d,i) => `
    <div class="drink-card">
      <div class="drink-top">
        <div class="drink-name">${d.name}</div>
        <div class="drink-price">NT$${d.price}</div>
      </div>
      ${d.img ? `<img src="${d.img}" alt="${d.name}" style="width:100%;height:160px;object-fit:cover;border-radius:8px;">` : ''}
      <div class="drink-desc">${d.desc}</div>
      <div class="drink-meta">
        <span class="drink-badge ${tempClass[d.temp]}">${tempLabel[d.temp]}</span>
        <span class="drink-badge badge-bean">${d.bean}</span>
      </div>
      <button class="add-btn" onclick="addToCart(${i})">加入購物車</button>
    </div>`).join('');
}

/* ── Cart ── */
function addToCart(idx) {
  const item = drinks[idx];
  const existing = cart.find(c => c.name === item.name);
  if (existing) existing.qty++;
  else cart.push({ name: item.name, price: item.price, qty: 1 });
  updateCartCount();
  showToast(item.name + ' 已加入購物車');
}

function updateCartCount() {
  const total = cart.reduce((s,c) => s+c.qty, 0);
  document.getElementById('cart-count').textContent = total > 0 ? '(' + total + ')' : '';
}

function renderCart() {
  const container = document.getElementById('cart-container');
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty"><div class="cart-empty-icon">☕</div><div>購物車是空的</div><div style="margin-top:8px;font-size:12px">去選購您喜愛的咖啡飲品吧！</div></div>';
    return;
  }
  const subtotal = cart.reduce((s,c) => s+c.price*c.qty, 0);
  const tax = Math.round(subtotal * 0.05);
  const total = subtotal + tax;
  container.innerHTML = `
    <div>${cart.map((item,i) => `
      <div class="cart-item">
        <div style="flex:1">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-sub">NT$${item.price} / 杯</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </div>
        <div class="cart-item-price">NT$${item.price * item.qty}</div>
        <button class="remove-btn" onclick="removeItem(${i})">✕</button>
      </div>`).join('')}
    </div>
    <div class="cart-summary">
      <div class="cart-row"><span>小計</span><span>NT$${subtotal}</span></div>
      <div class="cart-row"><span>服務費 (5%)</span><span>NT$${tax}</span></div>
      <div class="cart-total"><span>總計</span><span>NT$${total}</span></div>
    </div>
    <div class="customer-info">
      <div class="customer-info-title">訂購人資料</div>
      <div class="info-field">
        <label class="info-label" for="cust-name">姓名<span class="req">*</span></label>
        <input class="info-input" id="cust-name" type="text" placeholder="請輸入姓名" maxlength="20" />
      </div>
      <div class="info-field">
        <label class="info-label" for="cust-phone">電話<span class="req">*</span></label>
        <input class="info-input" id="cust-phone" type="tel" placeholder="請輸入聯絡電話" maxlength="20" />
      </div>
    </div>
    <button class="checkout-btn" onclick="checkout()" style="margin-top:16px">確認結帳</button>`;
}

function changeQty(i, delta) {
  cart[i].qty += delta;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  updateCartCount();
  renderCart();
}

function removeItem(i) {
  cart.splice(i, 1);
  updateCartCount();
  renderCart();
}

async function checkout() {
  if (cart.length === 0) return;
  const nameEl = document.getElementById('cust-name');
  const phoneEl = document.getElementById('cust-phone');
  const name = nameEl ? nameEl.value.trim() : '';
  const phone = phoneEl ? phoneEl.value.trim() : '';
  let valid = true;
  if (nameEl) { nameEl.classList.remove('error'); if (!name) { nameEl.classList.add('error'); valid = false; } }
  if (phoneEl) { phoneEl.classList.remove('error'); if (!phone) { phoneEl.classList.add('error'); valid = false; } }
  if (!valid) { showToast('請填寫姓名和電話'); return; }

  const subtotal = cart.reduce((s,c) => s+c.price*c.qty, 0);
  const tax = Math.round(subtotal * 0.05);
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const timeStr = (now.getMonth()+1) + '/' + now.getDate() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

  const itemsStr = JSON.stringify(cart.map(c => ({ name: c.name, qty: c.qty, price: c.price })));
  const params = new URLSearchParams({
    action: 'addOrder',
    time: timeStr,
    name,
    phone,
    items: itemsStr,
    subtotal: String(subtotal),
    total: String(subtotal + tax)
  });

  const btn = document.querySelector('.checkout-btn');
  if (btn) { btn.disabled = true; btn.textContent = '送出中…'; }

  try {
    const res = await fetch(GAS_URL + '?' + params.toString());
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'failed');
    cart = [];
    updateCartCount();
    renderCart();
    showToast('訂單已送出，感謝您的訂購！☕');
  } catch (e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '確認結帳'; }
    showToast('送出失敗，請確認網路連線或 Apps Script 設定');
  }
}

/* ── Admin ── */
function adminLogin() {
  const pwd = document.getElementById('admin-pwd').value;
  const err = document.getElementById('admin-err');
  if (pwd === '12345') {
    adminLoggedIn = true;
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-dash').style.display = 'block';
    err.style.display = 'none';
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('filter-all').classList.add('active');
    loadOrders();
  } else {
    err.style.display = 'block';
    document.getElementById('admin-pwd').value = '';
    document.getElementById('admin-pwd').focus();
  }
}

function adminLogout() {
  adminLoggedIn = false;
  if (adminPollTimer) { clearInterval(adminPollTimer); adminPollTimer = null; }
  orders = [];
  document.getElementById('admin-login').style.display = 'flex';
  document.getElementById('admin-dash').style.display = 'none';
  document.getElementById('admin-pwd').value = '';
  document.getElementById('admin-err').style.display = 'none';
}

/* 從 Google Sheets 讀取訂單（每 15 秒自動刷新） */
async function loadOrders() {
  document.getElementById('admin-orders').innerHTML = '<div class="order-empty">載入中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getOrders');
    const json = await res.json();
    if (!json.ok) throw new Error('api error');
    orders = (json.orders || []).reverse().map(o => ({
      ...o,
      items: typeof o.items === 'string' ? JSON.parse(o.items) : o.items
    }));
    if (adminLoggedIn) renderAdminDash();
  } catch (e) {
    console.error(e);
    document.getElementById('admin-orders').innerHTML = '<div class="order-empty">載入失敗，請確認 Apps Script 網址設定是否正確</div>';
    return;
  }
  // 自動每 15 秒刷新
  if (!adminPollTimer) {
    adminPollTimer = setInterval(() => { if (adminLoggedIn) loadOrders(); }, 15000);
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAdminDash();
}

function renderAdminDash() {
  const total = orders.length;
  const pending = orders.filter(o => o.status === 'pending').length;
  const done = orders.filter(o => o.status === 'done').length;
  document.getElementById('admin-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">總訂單數</div><div class="stat-val brown">${total}</div></div>
    <div class="stat-card"><div class="stat-label">待完成</div><div class="stat-val pending">${pending}</div></div>
    <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-val done">${done}</div></div>`;

  const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);
  const container = document.getElementById('admin-orders');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="order-empty">目前沒有訂單紀錄</div>';
    return;
  }

  container.innerHTML = filtered.map((o, idx) => `
    <div class="order-card${o.status === 'done' ? ' is-done' : ''}">
      <div class="order-head">
        <div>
          <div class="order-id">ORD-${String(filtered.length - idx).padStart(3,'0')}</div>
          <div class="order-time">${o.time || ''}</div>
        </div>
        <span class="status-badge ${o.status === 'pending' ? 'status-pending' : 'status-done'}">
          ${o.status === 'pending' ? '待完成' : '已完成'}
        </span>
      </div>
      <div style="display:flex;gap:20px;margin-bottom:12px;padding:10px 12px;background:#faf8f5;border-radius:8px;">
        <div style="font-size:13px;color:#444"><span style="font-size:11px;color:#888;display:block;margin-bottom:2px">姓名</span>${o.name || '—'}</div>
        <div style="font-size:13px;color:#444"><span style="font-size:11px;color:#888;display:block;margin-bottom:2px">電話</span>${o.phone || '—'}</div>
      </div>
      <div class="order-items">
        ${(o.items||[]).map(it => `
          <div class="order-item-row">
            <span>${it.name} × ${it.qty}</span>
            <span>NT$${it.price * it.qty}</span>
          </div>`).join('')}
      </div>
      <div class="order-foot">
        <div>
          <div class="order-total-label">合計（含服務費）</div>
          <div class="order-total-val">NT$${o.total}</div>
        </div>
        ${o.status === 'pending'
          ? `<button class="confirm-btn" onclick="confirmOrder('${o.id}')">確認完成</button>`
          : `<span class="done-check">✓ 已確認完成</span>`}
      </div>
    </div>`).join('');
}

async function confirmOrder(orderId) {
  try {
    const params = new URLSearchParams({ action: 'updateStatus', id: orderId });
    const res = await fetch(GAS_URL + '?' + params.toString());
    const json = await res.json();
    if (!json.ok) throw new Error('update failed');
    showToast('訂單已標記為完成');
    loadOrders();
  } catch (e) {
    console.error(e);
    showToast('更新失敗，請重試');
  }
}

/* ── Toast ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

renderBeans();
renderDrinks();
</script>
</body>
</html>
